version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: src/SocialGraph.API/Dockerfile
    ports:
      - "5000:5000"
    networks:
      - social-network

  worker:
    build:
      context: .
      dockerfile: src/SocialGraph.AI/Dockerfile
    depends_on:
      - api
    environment:
      - ApiBaseUrl=http://api:5000
    networks:
      - social-network

  ui:
    build:
      context: .
      dockerfile: src/SocialGraph.UI/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - social-network

networks:
  social-network:
    driver: bridge
