version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: src/SocialGraph.API/Dockerfile
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/swagger/index.html"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - social-network

  worker:
    build:
      context: .
      dockerfile: src/SocialGraph.AI/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      - ApiBaseUrl=http://api:5000
    networks:
      - social-network

  ui:
    build:
      context: .
      dockerfile: src/SocialGraph.UI/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - social-network

networks:
  social-network:
    driver: bridge
